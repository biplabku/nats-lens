name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --release --all

      - name: Test
        run: cargo test --all

  # ── Integration test: start NATS, run nats-lens init ─────────────────────────
  integration:
    name: Integration test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats-test \
            -p 4222:4222 \
            -p 8222:8222 \
            nats:2.10-alpine \
            --js \
            -m 8222
          # Wait for NATS to be ready
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8222/healthz > /dev/null 2>&1; then
              echo "NATS ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8222/healthz

      - name: Build nats-lens
        run: cargo build --release -p nats-lens

      - name: Run init audit against live NATS
        run: |
          ./target/release/nats-lens --nats nats://localhost:4222 init --format json
          echo "Exit code: $?"

      - name: Health check endpoint
        run: |
          ./target/release/nats-lens --nats nats://localhost:4222 --port 9999 &
          LENS_PID=$!
          sleep 3
          curl -sf http://localhost:9999/health | grep '"status":"ok"'
          kill $LENS_PID

      - name: Stop NATS
        if: always()
        run: docker stop nats-test && docker rm nats-test
