name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  # ── Build cross-platform binaries ─────────────────────────────────────────────
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: nats-lens-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: nats-lens-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: nats-lens-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: nats-lens-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'linux')
        run: |
          sudo apt-get install -y musl-tools
          # For aarch64 cross-compilation
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          cargo build --release -p nats-lens --target ${{ matrix.target }}
          mv target/${{ matrix.target }}/release/nats-lens ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # ── Publish to crates.io ──────────────────────────────────────────────────────
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build-binaries

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Publish nats-lens-core
        run: cargo publish -p nats-lens-core --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish nats-lens
        run: |
          sleep 10  # crates.io needs a moment to index the dependency
          cargo publish -p nats-lens --token ${{ secrets.CRATES_IO_TOKEN }}

  # ── Build and push Docker image ───────────────────────────────────────────────
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build-binaries

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ── Create GitHub release with binaries ───────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, docker]

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nats-lens-linux-x86_64/nats-lens-linux-x86_64
            nats-lens-linux-aarch64/nats-lens-linux-aarch64
            nats-lens-macos-x86_64/nats-lens-macos-x86_64
            nats-lens-macos-aarch64/nats-lens-macos-aarch64
          generate_release_notes: true
          body: |
            ## Installation

            **macOS (Apple Silicon)**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/nats-lens-macos-aarch64 \
              -o nats-lens && chmod +x nats-lens && sudo mv nats-lens /usr/local/bin/
            ```

            **macOS (Intel)**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/nats-lens-macos-x86_64 \
              -o nats-lens && chmod +x nats-lens && sudo mv nats-lens /usr/local/bin/
            ```

            **Linux**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/nats-lens-linux-x86_64 \
              -o nats-lens && chmod +x nats-lens && sudo mv nats-lens /usr/local/bin/
            ```

            **Docker**
            ```bash
            docker run -p 8080:8080 ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
              --nats nats://your-server:4222
            ```
