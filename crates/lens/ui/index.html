<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nats-lens — JetStream Health Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:      #080d18;
      --surface: #0e1525;
      --raised:  #152033;
      --hover:   #1c2a42;
      --border:  #1e2d45;
      --soft:    #162035;
      --t1: #e8edf5; --t2: #7a8fa8; --t3: #3d5168;
      --cyan: #22d3ee; --cyan-d: #0e7490;
      --green: #10b981; --amber: #f59e0b; --red: #f43f5e;
      --r: 8px; --r-sm: 5px;
      --font: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: var(--font); font-size: 13px; line-height: 1.5; background: var(--bg); color: var(--t1); -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    .app { display: grid; grid-template-rows: 52px 1fr; grid-template-columns: 260px 1fr; grid-template-areas: "top top" "side main"; height: 100vh; overflow: hidden; }

    /* Topbar */
    .top { grid-area: top; display: flex; align-items: center; gap: 10px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: -.3px; }
    .logo-mark { width: 26px; height: 26px; background: linear-gradient(135deg,var(--cyan),var(--cyan-d)); border-radius: 6px; display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #000; }
    .top-divider { width: 1px; height: 18px; background: var(--border); margin: 0 2px; }
    .top-sub { font-size: 11px; font-weight: 500; color: var(--t2); letter-spacing: .5px; text-transform: uppercase; }
    .top-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .conn { display: flex; align-items: center; gap: 6px; background: var(--raised); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; font-size: 11px; color: var(--t2); font-family: var(--mono); }
    .conn-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--t3); transition: background .3s; }
    .conn-dot.live { background: var(--green); box-shadow: 0 0 6px rgba(16,185,129,.5); }
    .conn-dot.err  { background: var(--red); }
    .ts { font-size: 11px; color: var(--t3); font-variant-numeric: tabular-nums; }

    /* Sidebar */
    .side { grid-area: side; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .side-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--soft); display: flex; align-items: center; justify-content: space-between; }
    .side-label { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--t3); }
    .side-count  { font-size: 11px; color: var(--t3); font-variant-numeric: tabular-nums; }
    .side-list   { flex: 1; overflow-y: auto; padding: 6px 8px; }
    .side-list::-webkit-scrollbar { width: 3px; }
    .side-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .sitem { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: var(--r-sm); cursor: pointer; transition: background .1s; user-select: none; }
    .sitem:hover { background: var(--hover); }
    .sitem.sel   { background: rgba(34,211,238,.06); }

    .pip { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--t3); transition: background .3s; }
    .pip.healthy  { background: var(--green); box-shadow: 0 0 5px rgba(16,185,129,.35); }
    .pip.warning  { background: var(--amber); box-shadow: 0 0 5px rgba(245,158,11,.35); }
    .pip.critical { background: var(--red);   box-shadow: 0 0 5px rgba(244,63,94,.35); animation: blink 1.4s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

    .sinfo { flex: 1; min-width: 0; }
    .sname { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .smeta { font-size: 11px; color: var(--t2); margin-top: 1px; }

    .badge { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; letter-spacing: .3px; flex-shrink: 0; }
    .badge.healthy  { background: rgba(16,185,129,.1);  color: var(--green); }
    .badge.warning  { background: rgba(245,158,11,.1);  color: var(--amber); }
    .badge.critical { background: rgba(244,63,94,.1);   color: var(--red);   }

    /* Main */
    .main { grid-area: main; display: flex; flex-direction: column; overflow: hidden; }

    .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
    .empty-ico { width: 52px; height: 52px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--border); display: grid; place-items: center; font-size: 22px; color: var(--t3); }
    .empty h3  { font-size: 13px; font-weight: 600; color: var(--t2); }
    .empty p   { font-size: 12px; color: var(--t3); }

    .detail { flex: 1; overflow-y: auto; padding: 22px 24px; display: flex; flex-direction: column; gap: 18px; }
    .detail::-webkit-scrollbar { width: 3px; }
    .detail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .dhead { display: flex; align-items: flex-start; gap: 10px; }
    .dtitle { font-size: 18px; font-weight: 700; letter-spacing: -.4px; }
    .dsub   { font-size: 12px; color: var(--t2); margin-top: 2px; font-family: var(--mono); }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); }
    .chead { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px 11px; border-bottom: 1px solid var(--soft); }
    .ctitle { font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--t2); }
    .ccount { font-size: 11px; color: var(--t3); }

    /* Table */
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 9px 16px; font-size: 11px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--t3); border-bottom: 1px solid var(--soft); }
    th:not(:first-child) { text-align: right; }
    td { padding: 10px 16px; border-bottom: 1px solid var(--soft); vertical-align: middle; font-variant-numeric: tabular-nums; }
    td:not(:first-child) { text-align: right; }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .08s; }
    tbody tr:hover { background: var(--hover); }

    .cname { font-weight: 500; font-family: var(--mono); font-size: 12px; }
    .num   { font-family: var(--mono); font-size: 12px; }
    .hi-a  { color: var(--amber); }
    .hi-r  { color: var(--red); }

    .bar-wrap { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
    .bar-bg   { width: 52px; height: 4px; background: var(--raised); border-radius: 2px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 2px; transition: width .3s; background: var(--t3); }
    .bar-fill.w { background: var(--amber); }
    .bar-fill.c { background: var(--red); }
    .bar-pct   { font-size: 11px; font-family: var(--mono); color: var(--t2); min-width: 28px; text-align: right; }

    .sdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
    .sdot.ok { background: var(--green); }
    .sdot.w  { background: var(--amber); }
    .sdot.c  { background: var(--red); animation: blink 1.4s infinite; }

    /* Violations */
    .vlist { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; }
    .vcard { border-radius: var(--r-sm); border: 1px solid; overflow: hidden; animation: vi .18s ease-out; }
    @keyframes vi { from{opacity:0;transform:translateY(-3px)} to{opacity:1;transform:translateY(0)} }
    .vcard.critical { border-color: rgba(244,63,94,.22); background: linear-gradient(135deg,rgba(244,63,94,.055),rgba(244,63,94,.015)); }
    .vcard.warning  { border-color: rgba(245,158,11,.18); background: linear-gradient(135deg,rgba(245,158,11,.05),rgba(245,158,11,.015)); }
    .vin  { padding: 11px 13px; }
    .vrow { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
    .vpill { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; letter-spacing: .5px; text-transform: uppercase; font-family: var(--mono); }
    .vcard.critical .vpill { background: rgba(244,63,94,.18); color: var(--red); }
    .vcard.warning  .vpill { background: rgba(245,158,11,.18); color: var(--amber); }
    .vcons { font-size: 11px; color: var(--t2); font-family: var(--mono); }
    .vtime { font-size: 11px; color: var(--t3); margin-left: auto; }
    .vdesc { font-size: 12px; color: var(--t1); line-height: 1.5; margin-bottom: 8px; }
    .fixrow { display: flex; align-items: center; gap: 7px; background: rgba(0,0,0,.28); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 7px 10px; }
    .fixlbl { font-size: 10px; font-weight: 600; color: var(--t3); letter-spacing: .5px; text-transform: uppercase; white-space: nowrap; }
    .fixcmd { font-size: 11px; font-family: var(--mono); color: var(--cyan); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .copybtn { flex-shrink: 0; padding: 3px 8px; background: var(--raised); border: 1px solid var(--border); border-radius: 4px; font-size: 10px; font-weight: 600; color: var(--t2); transition: all .12s; }
    .copybtn:hover { background: var(--hover); color: var(--t1); }
    .copybtn.ok { color: var(--green); border-color: rgba(16,185,129,.25); }

    .vnil { display: flex; align-items: center; gap: 7px; padding: 12px 14px; font-size: 12px; color: var(--t2); }
    .vnil-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

    /* Feed */
    .feed { border-top: 1px solid var(--border); background: var(--surface); height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 16px; flex-shrink: 0; }
    .flbl { display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: var(--t3); flex-shrink: 0; }
    .fldot { width: 5px; height: 5px; border-radius: 50%; background: var(--red); animation: blink 1.4s infinite; }
    .fevents { flex: 1; overflow: hidden; display: flex; align-items: center; gap: 14px; }
    .fevent  { display: flex; align-items: center; gap: 5px; flex-shrink: 0; font-size: 11px; animation: vi .25s ease-out; }
    .fets    { color: var(--t3); font-family: var(--mono); font-size: 10px; }
    .festream{ font-weight: 600; font-family: var(--mono); color: var(--t1); }
    .fesep   { color: var(--t3); }
    .fetype  { font-weight: 600; font-size: 10px; padding: 1px 5px; border-radius: 3px; }
    .fetype.critical { color: var(--red);   background: rgba(244,63,94,.1); }
    .fetype.warning  { color: var(--amber); background: rgba(245,158,11,.1); }
    .fnil    { font-size: 11px; color: var(--t3); font-style: italic; }
    .fcnt    { font-size: 11px; color: var(--t3); margin-left: auto; flex-shrink: 0; }

    /* Toast */
    #toasts { position: fixed; top: 58px; right: 14px; display: flex; flex-direction: column; gap: 7px; z-index: 200; pointer-events: none; }
    .toast  { background: var(--raised); border: 1px solid var(--border); border-left: 3px solid var(--red); border-radius: var(--r-sm); padding: 10px 13px; min-width: 270px; max-width: 340px; pointer-events: all; animation: vi .18s ease-out; box-shadow: 0 4px 20px rgba(0,0,0,.5); }
    .toast.warning { border-left-color: var(--amber); }
    .toast-t { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
    .toast-b { font-size: 11px; color: var(--t2); line-height: 1.4; }
    .toast-x { animation: tx .18s ease-in forwards; }
    @keyframes tx { to{opacity:0;transform:translateX(8px)} }

    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="logo"><div class="logo-mark">N</div>nats-lens</div>
    <div class="top-divider"></div>
    <span class="top-sub">JetStream Monitor</span>
    <div class="top-right">
      <div class="conn"><div class="conn-dot" id="cdot"></div><span id="curl">—</span></div>
      <span class="ts" id="cts"></span>
    </div>
  </header>

  <aside class="side">
    <div class="side-head">
      <span class="side-label">Streams</span>
      <span class="side-count" id="scnt">—</span>
    </div>
    <div class="side-list" id="slist">
      <div style="padding:20px;text-align:center;color:var(--t3);font-size:12px">Connecting…</div>
    </div>
  </aside>

  <main class="main">
    <div class="empty" id="estate">
      <div class="empty-ico">⌖</div>
      <h3>Select a stream</h3>
      <p>Auto-refreshes every 10s</p>
    </div>

    <div class="detail hidden" id="dview">
      <div class="dhead">
        <div>
          <div class="dtitle" id="dname">—</div>
          <div class="dsub"   id="dmeta">—</div>
        </div>
        <div id="dbadge" style="margin-top:4px"></div>
      </div>

      <div class="card">
        <div class="chead"><span class="ctitle">Consumers</span></div>
        <table>
          <thead>
            <tr>
              <th>Name</th><th>Lag</th><th>Redeliv/min</th>
              <th>Ack Pending</th><th>Trend</th><th style="text-align:center">Health</th>
            </tr>
          </thead>
          <tbody id="ctbody"></tbody>
        </table>
      </div>

      <div class="card">
        <div class="chead">
          <span class="ctitle">Violations</span>
          <span class="ccount" id="vcnt"></span>
        </div>
        <div id="vbody">
          <div class="vnil" id="vnil"><div class="vnil-dot"></div>All consumers healthy</div>
          <div class="vlist" id="vcards"></div>
        </div>
      </div>
    </div>

    <div class="feed">
      <div class="flbl"><div class="fldot"></div>Live</div>
      <div class="fevents" id="fevents"><span class="fnil">Waiting…</span></div>
      <span class="fcnt" id="fcnt"></span>
    </div>
  </main>
</div>
<div id="toasts"></div>

<script>
const API = '', charts = {};
let state = { streams:[], sel:null }, totalEv = 0;

document.addEventListener('DOMContentLoaded', () => {
  fetch(`${API}/health`).then(() => conn(true)).catch(() => conn(false));
  load(); setInterval(load, 10000); sse();
});

function conn(ok) {
  document.getElementById('cdot').className = 'conn-dot'+(ok?' live':' err');
  document.getElementById('curl').textContent = location.host || 'localhost';
}
function stamp() {
  const t = new Date();
  document.getElementById('cts').textContent = `updated ${t.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;
}

async function load() {
  try {
    const r = await fetch(`${API}/api/streams`);
    state.streams = (await r.json()) || [];
    conn(true); sidebar();
    if (state.sel) { const s = state.streams.find(x => x.stream_name===state.sel); if(s) detail(s); }
    stamp();
  } catch(e) { conn(false); }
}

function sidebar() {
  const list = document.getElementById('slist');
  const cnt  = document.getElementById('scnt');
  cnt.textContent = `${state.streams.length} stream${state.streams.length!==1?'s':''}`;
  if (!state.streams.length) { list.innerHTML='<div style="padding:20px;text-align:center;color:var(--t3);font-size:12px">No streams</div>'; return; }
  list.innerHTML = state.streams.map(s => {
    const h = (s.health||'healthy').toLowerCase();
    const v = (s.consumers||[]).flatMap(c=>c.violations||[]).length;
    const n = s.consumers?.length??0;
    return `<div class="sitem${state.sel===s.stream_name?' sel':''}" onclick="pick('${e(s.stream_name)}')">
      <div class="pip ${h}"></div>
      <div class="sinfo">
        <div class="sname">${e(s.stream_name)}</div>
        <div class="smeta">${n} consumer${n!==1?'s':''}${v?` · ${v} violation${v!==1?'s':''}`:''}
        </div>
      </div>
      <span class="badge ${h}">${cap(h)}</span>
    </div>`;
  }).join('');
}

function pick(name) {
  state.sel = name; sidebar();
  const s = state.streams.find(x=>x.stream_name===name); if(!s) return;
  document.getElementById('estate').classList.add('hidden');
  document.getElementById('dview').classList.remove('hidden');
  detail(s);
}

function detail(s) {
  const st = s.state||{};
  document.getElementById('dname').textContent = s.stream_name;
  document.getElementById('dmeta').textContent = `${fmt(st.messages??0)} msgs · seq ${fmt(st.first_seq??0)}–${fmt(st.last_seq??0)}`;
  const h = (s.health||'healthy').toLowerCase();
  document.getElementById('dbadge').innerHTML = `<span class="badge ${h}">${cap(h)}</span>`;
  consumers(s.stream_name, s.consumers||[]);
  violations((s.consumers||[]).flatMap(c=>(c.violations||[]).map(v=>({...v,_con:c.consumer_name}))));
}

function consumers(sn, cs) {
  const tb = document.getElementById('ctbody');
  if (!cs.length) { tb.innerHTML=`<tr><td colspan="6" style="text-align:center;color:var(--t3);padding:18px">No consumers</td></tr>`; return; }
  tb.innerHTML = cs.map(c => {
    const h   = (c.health||'healthy').toLowerCase();
    const lag = c.lag??0;
    const lc  = lag>1000?'hi-r':lag>100?'hi-a':'';
    const rd  = (c.redeliveries_per_min||0).toFixed(1);
    const rc  = parseFloat(rd)>5?'hi-r':'';
    const sn2 = c.snapshot||{};
    const mp  = sn2.max_ack_pending||1;
    const ap  = sn2.num_ack_pending||0;
    const pct = Math.round(ap/mp*100);
    const bc  = pct>=95?'c':pct>=80?'w':'';
    const dc  = h==='critical'?'c':h==='warning'?'w':'ok';
    const cid = `s${sn}_${c.consumer_name}`.replace(/\W/g,'_');
    return `<tr>
      <td><span class="cname">${e(c.consumer_name)}</span></td>
      <td><span class="num ${lc}">${fmt(lag)}</span></td>
      <td><span class="num ${rc}">${rd}</span></td>
      <td><div class="bar-wrap"><div class="bar-bg"><div class="bar-fill ${bc}" style="width:${pct}%"></div></div><span class="bar-pct">${pct}%</span></div></td>
      <td style="text-align:right"><canvas id="${cid}" width="68" height="26"></canvas></td>
      <td style="text-align:center"><div class="sdot ${dc}"></div></td>
    </tr>`;
  }).join('');
  requestAnimationFrame(()=>{ cs.forEach(c=>{ spark(`s${sn}_${c.consumer_name}`.replace(/\W/g,'_'), sn, c.consumer_name, c.health); }); });
}

async function spark(id, sn, cn, health) {
  try {
    const r = await fetch(`${API}/api/history/${encodeURIComponent(sn)}/${encodeURIComponent(cn)}`);
    const d = await r.json();
    if (!Array.isArray(d)||d.length<2) return;
    const lags = d.map(x=>x.lag||0);
    const col  = health==='critical'?'#f43f5e':health==='warning'?'#f59e0b':'#10b981';
    if (charts[id]) charts[id].destroy();
    const canvas = document.getElementById(id); if(!canvas) return;
    charts[id] = new Chart(canvas, {
      type:'line',
      data:{ labels:lags.map((_,i)=>i), datasets:[{ data:lags, borderColor:col, borderWidth:1.5, pointRadius:0, tension:.4, fill:true, backgroundColor:col+'15' }] },
      options:{ responsive:false, animation:false, plugins:{legend:{display:false},tooltip:{enabled:false}}, scales:{x:{display:false},y:{display:false,min:0}} }
    });
  } catch(_){}
}

function violations(vs) {
  const vnil  = document.getElementById('vnil');
  const vcnt  = document.getElementById('vcnt');
  const cards = document.getElementById('vcards');
  vcnt.textContent = vs.length ? `${vs.length} active` : '';
  if (!vs.length) { vnil.classList.remove('hidden'); cards.innerHTML=''; return; }
  vnil.classList.add('hidden');
  cards.innerHTML = vs.map(v => {
    const sev = (v.severity||'warning').toLowerCase();
    const vt  = v.violation||{};
    const fix = vt.fix_command||null;
    const ts  = v.detected_at ? new Date(v.detected_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '';
    const fid = 'f'+Math.random().toString(36).slice(2);
    return `<div class="vcard ${sev}"><div class="vin">
      <div class="vrow">
        <span class="vpill">${e(vt.type||'')}</span>
        <span class="vcons">${e(v._con||v.consumer_name||'')}</span>
        ${ts?`<span class="vtime">${ts}</span>`:''}
      </div>
      <div class="vdesc">${e(v.description||'')}</div>
      ${fix?`<div class="fixrow">
        <span class="fixlbl">Fix</span>
        <span class="fixcmd" id="${fid}">${e(fix)}</span>
        <button class="copybtn" onclick="cp('${fid}',this)">Copy</button>
      </div>`:''}
    </div></div>`;
  }).join('');
}

function cp(id, btn) {
  const t = document.getElementById(id)?.textContent; if(!t) return;
  navigator.clipboard.writeText(t).then(()=>{ btn.textContent='Copied!'; btn.classList.add('ok'); setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('ok');},2000); });
}

function sse() {
  let s; const open = () => {
    s = new EventSource(`${API}/api/violations/stream`);
    s.onopen=()=>conn(true); s.onerror=()=>{ s.close(); setTimeout(open,5000); };
    s.onmessage=ev=>{ try{ const v=JSON.parse(ev.data); totalEv++; feed(v); toast(v); load(); }catch(_){} };
  }; open();
}

function feed(v) {
  const box = document.getElementById('fevents');
  const sev = (v.severity||'warning').toLowerCase();
  const vt  = v.violation||{};
  const ts  = v.detected_at ? new Date(v.detected_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '';
  box.querySelector('.fnil')?.remove();
  const el = document.createElement('div');
  el.className = 'fevent';
  el.innerHTML = `<span class="fets">${ts}</span><span class="festream">${e(v.stream_name||'')}/${e(v.consumer_name||'')}</span><span class="fesep">·</span><span class="fetype ${sev}">${e(vt.type||'')}</span>`;
  box.insertBefore(el, box.firstChild);
  while (box.children.length>5) box.removeChild(box.lastChild);
  document.getElementById('fcnt').textContent = `${totalEv} event${totalEv!==1?'s':''}`;
}

function toast(v) {
  const root = document.getElementById('toasts');
  const sev  = (v.severity||'warning').toLowerCase();
  const el   = document.createElement('div');
  el.className = `toast ${sev}`;
  el.innerHTML = `<div class="toast-t">${e(v.stream_name||'')} · ${e(v.consumer_name||'')}</div><div class="toast-b">${e((v.description||'').slice(0,96))}${(v.description||'').length>96?'…':''}</div>`;
  root.appendChild(el);
  setTimeout(()=>{ el.classList.add('toast-x'); setTimeout(()=>el.remove(),200); }, 5000);
}

const e   = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const cap = s => s ? s[0].toUpperCase()+s.slice(1) : s;
const fmt = n => { const v=Number(n)||0; return v>=1e6?(v/1e6).toFixed(1)+'M':v>=1000?(v/1000).toFixed(1)+'K':String(v); };
</script>
</body>
