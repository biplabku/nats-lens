[workspace]
members = [
    "crates/core",
    "crates/lens",
    "crates/sim",
    "crates/eval",
]
resolver = "2"

[workspace.dependencies]
async-nats  = "0.38"
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono      = { version = "0.4", features = ["serde"] }
bytes       = "1"
futures-util = "0.3"
